name: Build, Test and Publish NuGet Package

on:
  push:
    tags:
      - 'v*'  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'
      - name: Restore dependencies
        run: dotnet restore Error.sln
      - name: Build project
        run: dotnet build Error.sln --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'
      - name: Run unit tests
        run: dotnet test Error.sln --configuration Release --verbosity normal

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'
      - name: Pack NuGet package
        run: dotnet build src/Error/Error.csproj --configuration Release
      - name: Publish to NuGet
        run: dotnet nuget push src/Error/bin/Release/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
